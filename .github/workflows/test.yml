name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tcl86:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: tpersist_test
          POSTGRES_DB: tpersist_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tpersist_test
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: tpersist_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptpersist_test"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      TCLLIBPATH: "${{ github.workspace }}/build-tjson ${{ github.workspace }}/build-deps/prefix/lib"
      TPERSIST_REQUIRE_SQLITE: "1"
      TPERSIST_TEST_POSTGRESQL: "-host 127.0.0.1 -port 5432 -database tpersist_test -user postgres -password tpersist_test"
      TPERSIST_TEST_MYSQL: "-host 127.0.0.1 -port 3306 -database tpersist_test -user root -password tpersist_test"
    steps:
      - uses: actions/checkout@v4
      - name: Install Tcl and TDBC drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake tcl8.6-dev tcl8.6-tdbc tcl8.6-tdbc-sqlite3 tcl8.6-tdbc-postgres tcl8.6-tdbc-mysql
      - uses: actions/checkout@v4
        with:
          repository: jerily/tjson
          ref: v1.0.30
          path: build-tjson-source
      - name: Build tjson
        run: |
          cmake -S build-tjson-source -B build-tjson -DTCL_INCLUDE_DIR=/usr/include/tcl8.6 -DTCL_TCLSH=/usr/bin/tclsh8.6
          cmake --build build-tjson --parallel 2
      - name: Install adapters for the integration tests
        run: |
          for dialect in sqlite postgresql mysql; do
            name="tpersist-$dialect"
            git clone --quiet --depth 1 --branch v0.1.8 "https://github.com/jerily/$name.git" "build-deps/$name"
            make -C "build-deps/$name" install PREFIX="$PWD/build-deps/prefix"
          done
      - name: Build and test shared extension
        run: |
          cmake -S . -B build -DTCL_INCLUDE_DIR=/usr/include/tcl8.6 -DTCL_TCLSH=/usr/bin/tclsh8.6
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - uses: actions/checkout@v4
        with:
          repository: jerily/tpersist-examples
          ref: v0.1.8
          path: build-deps/tpersist-examples
      - name: Run examples against this build
        env:
          TCLLIBPATH: "${{ github.workspace }}/build ${{ github.workspace }}/build-tjson ${{ github.workspace }}/build-deps/prefix/lib"
        run: make -C build-deps/tpersist-examples check TCLSH=tclsh8.6
      - name: Test static embedding
        run: |
          cmake -S . -B build-static -DBUILD_SHARED_LIBS=OFF -DTCL_INCLUDE_DIR=/usr/include/tcl8.6 -DTCL_TCLSH=/usr/bin/tclsh8.6
          cmake --build build-static --parallel 2
          ctest --test-dir build-static --output-on-failure
